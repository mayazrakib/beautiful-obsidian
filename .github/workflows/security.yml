name: Security
on:
    push:
    pull_request:
    schedule:
        - cron: '0 22 * * 0'
permissions:
    contents: read
jobs:
    repository_security:
        name: Repository Hygiene and Secrets
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
              with:
                  version: 0.12.23
            - name: Check Repository Hygiene and Secrets
              run: uvx --from pre-commit==4.7.0 pre-commit run --all-files
    dependency_security:
        name: Locked Dependency Security
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 24.22.0
                  cache: npm
            - run: npm ci
            - run: npm audit --audit-level=high
